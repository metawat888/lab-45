<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starry Night - Constellation Creator with Cloud Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            cursor: crosshair;
            touch-action: none;
        }
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }
        .pointer-auto {
            pointer-events: auto;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <canvas id="auroraCanvas"></canvas>

    <header class="w-full p-3 sm:p-5 flex flex-wrap justify-between items-center gap-2 ui-layer">
        <div class="flex items-center space-x-3 pointer-auto shrink-0">
            <!-- Logo and titles removed as requested -->
        </div>

        <!-- Top Constellation Control & Cloud Sync Panel in a single row -->
        <div class="flex flex-wrap items-center gap-2 pointer-auto ml-auto">
            <!-- Developer Badge -->
            <div class="glass-panel px-3 py-1.5 rounded-2xl hidden xl:flex items-center space-x-2.5 shadow-xl border border-white/10 shrink-0">
                <img src="https://github.com/metawat888/Picture/raw/69f9d3a46e017adc43abb8db3503ea8106ecae61/97488303_2887790847941184_353651305119481856_n.jpg" alt="Mr. Metawat Phongsaphang" class="w-7 h-7 rounded-full object-cover border-2 border-emerald-400/80 shadow-md" onerror="this.src='https://placehold.co/100x100/10b981/ffffff?text=MP'">
                <div class="text-left">
                    <p class="text-[9px] text-emerald-400 font-semibold tracking-wider uppercase">พัฒนาโดย</p>
                    <p class="text-[10px] font-bold text-gray-200">Mr. Metawat Phongsaphang</p>
                </div>
            </div>

            <!-- Star Style Picker (Color & Size) -->
            <div class="glass-panel px-3 py-1.5 rounded-xl flex items-center space-x-2 border border-white/10 shrink-0">
                <span class="text-[10px] text-gray-400 font-semibold">สี:</span>
                <div class="flex gap-1.5" id="starColorPicker">
                    <button class="w-4 h-4 rounded-full bg-white ring-2 ring-white scale-110 color-btn" data-color="#ffffff" title="สีขาว"></button>
                    <button class="w-4 h-4 rounded-full bg-cyan-400 color-btn" data-color="#38bdf8" title="สีฟ้า"></button>
                    <button class="w-4 h-4 rounded-full bg-amber-300 color-btn" data-color="#fde047" title="สีเหลือง"></button>
                    <button class="w-4 h-4 rounded-full bg-orange-500 color-btn" data-color="#f97316" title="สีส้ม"></button>
                    <button class="w-4 h-4 rounded-full bg-red-500 color-btn" data-color="#ef4444" title="สีแดง"></button>
                </div>
                <div class="h-4 w-[1px] bg-gray-700 mx-0.5"></div>
                <span class="text-[10px] text-gray-400 font-semibold">ขนาด:</span>
                <select id="starSizeSelect" class="bg-gray-900 text-gray-200 text-xs rounded-lg px-1.5 py-1 border border-gray-700 focus:outline-none focus:border-emerald-500">
                    <option value="3">เล็ก</option>
                    <option value="5" selected>กลาง</option>
                    <option value="8">ใหญ่</option>
                    <option value="12">ยักษ์</option>
                </select>
            </div>

            <!-- Delete Selected Star Button -->
            <button id="deleteSelectedStarBtn" class="px-3 py-1.5 rounded-xl bg-orange-500/20 hover:bg-orange-500/35 text-orange-300 text-xs font-semibold transition border border-orange-500/30 flex items-center space-x-1 shadow-md opacity-50 cursor-not-allowed shrink-0" disabled>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                <span>ลบดาวที่เลือก</span>
            </button>

            <!-- Delete Selected Line Button -->
            <button id="deleteSelectedLineBtn" class="px-3 py-1.5 rounded-xl bg-pink-500/20 hover:bg-pink-500/35 text-pink-300 text-xs font-semibold transition border border-pink-500/30 flex items-center space-x-1 shadow-md opacity-50 cursor-not-allowed shrink-0" disabled>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                <span>ลบเส้นเชื่อมที่เลือก</span>
            </button>

            <!-- Deselect Button -->
            <button id="deselectBtn" class="px-3 py-1.5 rounded-xl bg-gray-700/40 hover:bg-gray-700/70 text-gray-300 text-xs font-semibold transition border border-gray-600/40 flex items-center space-x-1 shadow-md shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>ไม่เลือก / ยกเลิก</span>
            </button>

            <!-- Constellation Action Buttons -->
            <button id="clearConstellationBtn" class="px-3 py-1.5 rounded-xl bg-red-500/20 hover:bg-red-500/35 text-red-300 text-xs font-semibold transition border border-red-500/30 flex items-center space-x-1 shadow-md shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                <span>ล้างทั้งหมด</span>
            </button>

            <!-- Cloud Presets Button -->
            <button id="openCloudModal" class="glass-panel px-3.5 py-1.5 rounded-xl text-xs font-semibold hover:bg-gray-800/80 transition flex items-center space-x-1.5 shadow-lg text-emerald-300 border border-emerald-500/20 shrink-0">
                <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h10a4 4 0 004-4m-4-5l-4-4m0 0l-4 4m4-4v12"></path></svg>
                <span>กลุ่มดาวในคลาวด์</span>
            </button>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-6 ui-layer">
    </main>

    <div id="cloudModal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden pointer-auto">
        <div class="glass-panel p-6 sm:p-8 rounded-3xl max-w-md w-full shadow-2xl border border-white/10 relative max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-white flex items-center space-x-2">
                    <svg class="w-5 h-5 text-teal-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h10a4 4 0 004-4m-4-5l-4-4m0 0l-4 4m4-4v12"></path></svg>
                    <span>บันทึกและโหลดกลุ่มดาวผ่านคลาวด์</span>
                </h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-white text-xl font-bold p-1">&times;</button>
            </div>

            <div class="mb-4">
                <label class="block text-xs text-gray-300 mb-1 font-medium">ชื่อกลุ่มดาวของคุณ</label>
                <div class="flex gap-2">
                    <input id="presetNameInput" type="text" placeholder="เช่น กลุ่มดาวหมีใหญ่..." class="flex-grow bg-gray-900/80 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    <button id="savePresetBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-md whitespace-nowrap">บันทึก</button>
                </div>
            </div>

            <div class="flex-grow overflow-y-auto space-y-2.5 pr-1" id="presetsListContainer">
                <p class="text-xs text-gray-400 text-center py-6">กำลังโหลดข้อมูลกลุ่มดาวจากคลาวด์...</p>
            </div>

            <div class="mt-4 pt-3 border-t border-gray-800 text-[11px] text-gray-400 text-center">
                User ID: <span id="currentUserIdDisplay" class="font-mono text-emerald-400">กำลังเชื่อมต่อ...</span>
            </div>
        </div>
    </div>

    <!-- Message Modal -->
    <div id="msgModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden pointer-auto">
        <div class="glass-panel p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl border border-white/10">
            <p id="msgText" class="text-sm text-gray-200 mb-4 font-medium"></p>
            <button id="msgOkBtn" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold transition shadow-md">ตกลง</button>
        </div>
    </div>

    <footer class="w-full p-4 text-center text-xs text-gray-400 ui-layer">
        สร้างสรรค์โดย <span class="text-emerald-400 font-semibold">Mr. Metawat Phongsaphang</span> &bull; HTML5 Canvas & Firebase DB
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        function showMessage(text) {
            document.getElementById('msgText').innerText = text;
            document.getElementById('msgModal').classList.remove('hidden');
        }
        document.getElementById('msgOkBtn').addEventListener('click', () => {
            document.getElementById('msgModal').classList.add('hidden');
        });

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'starry-sky-cloud-app';
        let firebaseConfig = {};
        try {
            firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        } catch (e) {
            console.warn('Firebase config unavailable, running in local-only demo mode.');
        }

        let db = null;
        let auth = null;
        let userId = 'demo-user-' + Math.random().toString(36).substring(2, 8);

        if (Object.keys(firebaseConfig).length > 0) {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                        userId = auth.currentUser?.uid || userId;
                        const userDisp = document.getElementById('currentUserIdDisplay');
                        if (userDisp) userDisp.innerText = userId;
                        loadCloudPresets();
                    } catch (err) {
                        console.error("Auth error:", err);
                        const userDisp = document.getElementById('currentUserIdDisplay');
                        if (userDisp) userDisp.innerText = userId + ' (Local)';
                    }
                };
                initAuth();
            } catch (e) {
                console.error("Firebase init error:", e);
                const userDisp = document.getElementById('currentUserIdDisplay');
                if (userDisp) userDisp.innerText = userId + ' (Offline)';
            }
        } else {
            const userDisp = document.getElementById('currentUserIdDisplay');
            if (userDisp) userDisp.innerText = userId + ' (Demo Mode)';
        }

        const canvas = document.getElementById('auroraCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let stars = [];
        let meteors = [];
        let customStars = [];
        let connections = [];
        let selectedStarIndex = null;
        let selectedLineIndex = null;
        let draggingStarIndex = null;
        let dragOffset = { x: 0, y: 0 };
        const starCount = 200;

        let currentStarColor = '#ffffff';
        let currentStarSize = 5;

        function initResize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.8 + 0.2,
                    alpha: Math.random(),
                    twinkleSpeed: 0.008 + Math.random() * 0.025
                });
            }
        }

        window.addEventListener('resize', () => {
            initResize();
            initStars();
        });

        initResize();
        initStars();

        // Star Color Picker UI
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('ring-2', 'ring-white', 'scale-110'));
                const target = e.currentTarget;
                target.classList.add('ring-2', 'ring-white', 'scale-110');
                currentStarColor = target.getAttribute('data-color');
            });
        });

        document.getElementById('starSizeSelect').addEventListener('change', (e) => {
            currentStarSize = parseInt(e.target.value);
        });

        function updateDeleteButtonState() {
            const btnStar = document.getElementById('deleteSelectedStarBtn');
            if (selectedStarIndex !== null) {
                btnStar.disabled = false;
                btnStar.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btnStar.disabled = true;
                btnStar.classList.add('opacity-50', 'cursor-not-allowed');
            }

            const btnLine = document.getElementById('deleteSelectedLineBtn');
            if (selectedLineIndex !== null) {
                btnLine.disabled = false;
                btnLine.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btnLine.disabled = true;
                btnLine.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        function deselectAll() {
            selectedStarIndex = null;
            selectedLineIndex = null;
            updateDeleteButtonState();
        }

        document.getElementById('deselectBtn').addEventListener('click', () => {
            deselectAll();
        });

        function getCanvasCoordinates(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handlePointerDown(clientX, clientY) {
            if (event.target.closest('header') || event.target.closest('#cloudModal') || event.target.closest('#msgModal')) {
                return;
            }

            const coords = getCanvasCoordinates(clientX, clientY);
            const x = coords.x;
            const y = coords.y;

            // Check if clicking existing custom star
            for (let i = 0; i < customStars.length; i++) {
                const s = customStars[i];
                const dist = Math.hypot(s.x - x, s.y - y);
                if (dist <= Math.max(s.size * 2, 20)) {
                    draggingStarIndex = i;
                    dragOffset = { x: x - s.x, y: y - s.y };
                    selectedLineIndex = null;

                    if (selectedStarIndex === null) {
                        selectedStarIndex = i;
                    } else if (selectedStarIndex === i) {
                        // Toggle keep
                    } else {
                        // Connect the two stars if not already connected
                        const exists = connections.some(c => 
                            (c.from === selectedStarIndex && c.to === i) || 
                            (c.from === i && c.to === selectedStarIndex)
                        );
                        if (!exists) {
                            connections.push({ from: selectedStarIndex, to: i });
                        }
                        selectedStarIndex = i;
                    }
                    updateDeleteButtonState();
                    return;
                }
            }

            // Check if clicking near a connection line to select it for deletion
            let clickedLineIdx = null;
            for (let i = 0; i < connections.length; i++) {
                const conn = connections[i];
                const s1 = customStars[conn.from];
                const s2 = customStars[conn.to];
                if (s1 && s2) {
                    const A = x - s1.x;
                    const B = y - s1.y;
                    const C = s2.x - s1.x;
                    const D = s2.y - s1.y;

                    const dot = A * C + B * D;
                    const lenSq = C * C + D * D;
                    let param = -1;
                    if (lenSq !== 0) param = dot / lenSq;

                    let xx, yy;
                    if (param < 0) {
                        xx = s1.x;
                        yy = s1.y;
                    } else if (param > 1) {
                        xx = s2.x;
                        yy = s2.y;
                    } else {
                        xx = s1.x + param * C;
                        yy = s1.y + param * D;
                    }

                    const lineDist = Math.hypot(x - xx, y - yy);
                    if (lineDist < 12) {
                        clickedLineIdx = i;
                        break;
                    }
                }
            }

            if (clickedLineIdx !== null) {
                selectedLineIndex = clickedLineIdx;
                selectedStarIndex = null;
                updateDeleteButtonState();
                return;
            }

            // Otherwise create new custom star if not dragging
            draggingStarIndex = null;
            selectedLineIndex = null;
            customStars.push({
                x: x,
                y: y,
                color: currentStarColor,
                size: currentStarSize,
                alpha: 1.0,
                pulseSpeed: 0.02 + Math.random() * 0.02
            });
            selectedStarIndex = customStars.length - 1;
            updateDeleteButtonState();
        }

        function handlePointerMove(clientX, clientY) {
            if (draggingStarIndex !== null && draggingStarIndex < customStars.length) {
                const coords = getCanvasCoordinates(clientX, clientY);
                customStars[draggingStarIndex].x = coords.x - dragOffset.x;
                customStars[draggingStarIndex].y = coords.y - dragOffset.y;
            }
        }

        function handlePointerUp() {
            draggingStarIndex = null;
        }

        canvas.addEventListener('mousedown', (e) => handlePointerDown(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        canvas.addEventListener('touchend', handlePointerUp);

        document.getElementById('deleteSelectedStarBtn').addEventListener('click', () => {
            if (selectedStarIndex !== null && selectedStarIndex < customStars.length) {
                connections = connections.filter(c => c.from !== selectedStarIndex && c.to !== selectedStarIndex);
                connections.forEach(c => {
                    if (c.from > selectedStarIndex) c.from--;
                    if (c.to > selectedStarIndex) c.to--;
                });
                customStars.splice(selectedStarIndex, 1);
                selectedStarIndex = null;
                updateDeleteButtonState();
            }
        });

        document.getElementById('deleteSelectedLineBtn').addEventListener('click', () => {
            if (selectedLineIndex !== null && selectedLineIndex < connections.length) {
                connections.splice(selectedLineIndex, 1);
                selectedLineIndex = null;
                updateDeleteButtonState();
            }
        });

        document.getElementById('clearConstellationBtn').addEventListener('click', () => {
            customStars = [];
            connections = [];
            selectedStarIndex = null;
            selectedLineIndex = null;
            updateDeleteButtonState();
            showMessage('ล้างกลุ่มดาวทั้งหมดเรียบร้อยแล้ว');
        });

        function spawnMeteor() {
            if (Math.random() < 0.003) {
                meteors.push({
                    x: Math.random() * width * 1.2 - width * 0.2,
                    y: Math.random() * (height * 0.4),
                    length: Math.random() * 80 + 40,
                    speed: Math.random() * 12 + 8,
                    angle: Math.PI / 4 + (Math.random() * 0.2 - 0.1),
                    opacity: 1.0
                });
            }
        }

        function draw() {
            const bgGradient = ctx.createLinearGradient(0, 0, 0, height);
            bgGradient.addColorStop(0, '#01040f');
            bgGradient.addColorStop(0.5, '#060d21');
            bgGradient.addColorStop(1, '#0f172a');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // Draw Background Twinkling Stars
            ctx.save();
            for (let star of stars) {
                star.alpha += star.twinkleSpeed;
                if (star.alpha > 1 || star.alpha < 0.15) {
                    star.twinkleSpeed = -star.twinkleSpeed;
                }
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }
            ctx.restore();

            // Spawn & Draw Shooting Stars (Meteors)
            spawnMeteor();
            ctx.save();
            ctx.lineWidth = 2;
            for (let i = meteors.length - 1; i >= 0; i--) {
                let m = meteors[i];
                const grad = ctx.createLinearGradient(
                    m.x, m.y, 
                    m.x - Math.cos(m.angle) * m.length, 
                    m.y - Math.sin(m.angle) * m.length
                );
                grad.addColorStop(0, `rgba(255, 255, 255, ${m.opacity})`);
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.strokeStyle = grad;
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(m.x - Math.cos(m.angle) * m.length, m.y - Math.sin(m.angle) * m.length);
                ctx.stroke();

                m.x += Math.cos(m.angle) * m.speed;
                m.y += Math.sin(m.angle) * m.speed;
                m.opacity -= 0.015;

                if (m.opacity <= 0) {
                    meteors.splice(i, 1);
                }
            }
            ctx.restore();

            // Draw Constellation Lines
            ctx.save();
            for (let i = 0; i < connections.length; i++) {
                const conn = connections[i];
                const s1 = customStars[conn.from];
                const s2 = customStars[conn.to];
                if (s1 && s2) {
                    ctx.strokeStyle = (i === selectedLineIndex) ? '#ec4899' : 'rgba(56, 189, 248, 0.6)';
                    ctx.lineWidth = (i === selectedLineIndex) ? 3 : 2;
                    ctx.beginPath();
                    ctx.moveTo(s1.x, s1.y);
                    ctx.lineTo(s2.x, s2.y);
                    ctx.stroke();
                }
            }
            ctx.restore();

            // Draw Custom Constellation Stars
            ctx.save();
            for (let i = 0; i < customStars.length; i++) {
                const s = customStars[i];
                ctx.fillStyle = s.color;
                ctx.shadowColor = s.color;
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();

                if (i === selectedStarIndex) {
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size + 6, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            ctx.restore();

            requestAnimationFrame(draw);
        }

        draw();

        // Cloud Modal & Firebase integration
        const cloudModal = document.getElementById('cloudModal');
        document.getElementById('openCloudModal').addEventListener('click', () => {
            cloudModal.classList.remove('hidden');
            loadCloudPresets();
        });
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            cloudModal.classList.add('hidden');
        });

        document.getElementById('savePresetBtn').addEventListener('click', async () => {
            const name = document.getElementById('presetNameInput').value.trim();
            if (!name) {
                showMessage('กรุณาใส่ชื่อกลุ่มดาว');
                return;
            }
            if (customStars.length === 0) {
                showMessage('กรุณาสร้างดาวอย่างน้อย 1 ดวงก่อนบันทึก');
                return;
            }

            if (!db) {
                showMessage('โหมดจำลอง: บันทึกข้อมูลแบบออฟไลน์สำเร็จ');
                cloudModal.classList.add('hidden');
                return;
            }

            try {
                await addDoc(collection(db, 'artifacts', appId, 'users', userId, 'constellations'), {
                    name: name,
                    stars: customStars,
                    connections: connections,
                    createdAt: new Date().toISOString()
                });
                document.getElementById('presetNameInput').value = '';
                showMessage('บันทึกกลุ่มดาวลงคลาวด์สำเร็จ!');
                cloudModal.classList.add('hidden');
                loadCloudPresets();
            } catch (err) {
                console.error("Save error:", err);
                showMessage('เกิดข้อผิดพลาดในการบันทึก กรุณาลองใหม่');
            }
        });

        async function loadCloudPresets() {
            const container = document.getElementById('presetsListContainer');
            if (!db) {
                container.innerHTML = `<p class="text-xs text-gray-400 text-center py-4">โหมดเดโม (ไม่มีฐานข้อมูลคลาวด์เชื่อมต่อ)</p>`;
                return;
            }

            try {
                const q = query(collection(db, 'artifacts', appId, 'users', userId, 'constellations'));
                const querySnapshot = await getDocs(q);
                if (querySnapshot.empty) {
                    container.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">ยังไม่มีกลุ่มดาวที่บันทึกไว้ในคลาวด์</p>`;
                    return;
                }

                container.innerHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const div = document.createElement('div');
                    div.className = 'glass-panel p-3 rounded-xl flex justify-between items-center border border-white/10';
                    div.innerHTML = `
                        <div>
                            <p class="text-xs font-bold text-white">${data.name}</p>
                            <p class="text-[10px] text-gray-400">ดวงดาว: ${data.stars?.length || 0} ดวง</p>
                        </div>
                        <div class="flex gap-2">
                            <button class="load-btn px-2.5 py-1 rounded-lg bg-teal-500/20 text-teal-300 hover:bg-teal-500/30 text-xs font-semibold transition" data-id="${docSnap.id}">โหลด</button>
                            <button class="del-btn px-2.5 py-1 rounded-lg bg-red-500/20 text-red-300 hover:bg-red-500/30 text-xs font-semibold transition" data-id="${docSnap.id}">ลบ</button>
                        </div>
                    `;
                    container.appendChild(div);
                });

                container.querySelectorAll('.load-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        const docSnap = querySnapshot.docs.find(d => d.id === id);
                        if (docSnap) {
                            const data = docSnap.data();
                            customStars = data.stars || [];
                            connections = data.connections || [];
                            selectedStarIndex = null;
                            selectedLineIndex = null;
                            updateDeleteButtonState();
                            cloudModal.classList.add('hidden');
                            showMessage(`โหลดกลุ่มดาว "${data.name}" สำเร็จ!`);
                        }
                    });
                });

                container.querySelectorAll('.del-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.getAttribute('data-id');
                        try {
                            await deleteDoc(doc(db, 'artifacts', appId, 'users', userId, 'constellations', id));
                            loadCloudPresets();
                        } catch (err) {
                            console.error("Delete error:", err);
                        }
                    });
                });

            } catch (err) {
                console.error("Load presets error:", err);
                container.innerHTML = `<p class="text-xs text-red-400 text-center py-4">ไม่สามารถโหลดข้อมูลจากคลาวด์ได้</p>`;
            }
        }
    </script>
</body>
</html>
